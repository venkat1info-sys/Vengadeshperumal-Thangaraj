<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vengadeshperumal Thangaraj | STEM Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@200;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; color: #f8fafc; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass-panel { background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(16px); border: 1px solid rgba(239, 68, 68, 0.15); border-radius: 2rem; }
        .card-shadow { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2); }
        .sticky-nav { position: sticky; top: 1rem; z-index: 1000; background: rgba(10, 10, 12, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(239, 68, 68, 0.1); }
        
        .hexagon-mask { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
        
        .typewriter-caret::after { content: '▋'; animation: blink 1.2s infinite; margin-left: 6px; color: #ef4444; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .interactive-project-card { transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .interactive-project-card:hover { transform: translateY(-5px) scale(1.01); box-shadow: 0 25px 30px -5px rgba(220, 38, 38, 0.15); background-color: rgba(30, 41, 59, 0.5); cursor: pointer; }
        
        .modal-anim { animation: scaleUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes scaleUp { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        .modal-progress-fill { height: 100%; background: linear-gradient(90deg, #dc2626, #f87171); }
        .modal-progress-active { animation: countdownProgress 20s linear forwards; }
        @keyframes countdownProgress { from { width: 100%; } to { width: 0%; } }
    </style>
</head>
<body class="bg-gradient-to-br from-red-950 via-slate-900 to-black min-h-screen p-4 md:p-10">

    <nav class="sticky-nav flex justify-center md:justify-between items-center px-8 py-4 rounded-full shadow-sm max-w-6xl mx-auto">
        <div class="hidden md:flex gap-8 font-mono text-[10px] uppercase font-bold text-slate-400 tracking-widest">
            <a href="#about" class="hover:text-red-400">Profile</a>
            <a href="#history" class="hover:text-red-400">Experience</a>
            <a href="#projects" class="hover:text-red-400">Projects</a>
            <a href="#portfolio" class="hover:text-red-400">Showreel</a>
        </div>
        <a href="https://drive.google.com/file/d/1u3f-diBEupHsiVNl_MidWZydSpgowHNH/view?usp=sharing" target="_blank" class="bg-red-600 text-white px-5 py-2 rounded-full text-[10px] font-bold uppercase hover:bg-red-700">CV Download</a>
    </nav>

    <div class="max-w-7xl mx-auto mt-12 space-y-12">
        <header class="glass-panel p-10 md:p-16 relative overflow-hidden">
            <div class="relative z-10 flex flex-col md:flex-row justify-between items-center gap-8">
                <div class="flex-1">
                    <h1 class="text-3xl md:text-5xl font-bold uppercase text-white">VENGADESHPERUMAL <span class="text-red-500">THANGARAJ</span></h1>
                    <p id="typewriter" class="mt-4 text-lg font-mono text-rose-300/90 min-h-[2.5rem] typewriter-caret"></p>
                </div>
                <div class="w-36 h-36 bg-red-500 hexagon-mask p-1">
                    <img src="https://drive.google.com/uc?export=view&id=1XOzg4JC-gJ8cfBMZuoc4D9gztF2Ey-Uv" class="w-full h-full object-cover hexagon-mask" onerror="this.src='https://via.placeholder.com/150';">
                </div>
            </div>
        </header>

        <section id="portfolio" class="glass-panel p-10 card-shadow">
            <h2 class="font-display text-lg font-bold uppercase mb-6 text-red-400 border-b border-red-900/40 pb-2">Motion Graphics & Video Showreel</h2>
            <div class="aspect-video w-full rounded-2xl overflow-hidden border border-red-900/50">
                <iframe src="https://drive.google.com/file/d/1CxVbqKZKnrJa3VYuj120kYVmJa2qDYJu/preview" class="w-full h-full" allowfullscreen></iframe>
            </div>
        </section>
    </div>

    <div id="popupModal" class="fixed inset-0 z-[2000] hidden items-center justify-center p-4">
        <div onclick="closeModal()" class="absolute inset-0 bg-slate-950/70 backdrop-blur-md"></div>
        <div class="bg-slate-900 text-slate-100 border border-red-900/50 shadow-2xl rounded-3xl max-w-4xl w-full relative modal-anim max-h-[90vh] flex flex-col overflow-hidden">
            <div class="w-full h-1.5 bg-slate-800"><div id="modalProgressBar" class="modal-progress-fill"></div></div>
            <div class="p-8 border-b border-slate-800"><h3 id="modalTitle" class="font-bold text-xl uppercase"></h3><div id="modalOverview" class="mt-4 text-xs"></div></div>
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

    <script>
        const elType = "Subject Matter Expert & Regional Technical Coordinator | STEM Operations Leader.";
        const el = document.getElementById("typewriter");
        let idx = 0, deleting = false;
        function loop() {
            el.textContent = elType.substring(0, idx);
            if (!deleting) { idx++; if (idx > elType.length) { deleting = true; setTimeout(loop, 2500); } else setTimeout(loop, 30); }
            else { idx--; if (idx === 0) { deleting = false; setTimeout(loop, 400); } else setTimeout(loop, 15); }
        }
        loop();

        function openModal(id) { /* ... Logic ... */ }
        function closeModal() { document.getElementById("popupModal").classList.add("hidden"); }
    </script>
</body>
</html>
